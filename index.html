<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edb29c">
  <title>Yellow</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <div id="game-shell" inert>
  <div class="sky" aria-hidden="true"><div class="sun"></div><div class="horizon"></div></div>
  <main id="app" aria-label="连锁升降棋盘"></main>
  <div id="pillar-controls" aria-label="九宫格方柱"></div>
  <header>
    <a class="wordmark" href="./" aria-label="Yellow 首页"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 2 29 10v16L16 34 3 26V10Z M3 10l13 8 13-8 M16 18v16 M9 14V7l7-4"/></svg><span>Yellow<span class="brand-en">A QUIET JOURNEY</span></span></a>
    <div class="chapter"><span id="chapter-name">第一章</span><strong id="current-level" class="current-level">第 1 关 / 60</strong></div>
    <nav aria-label="游戏工具"><button id="game-choose-level" class="icon-button restart-button" aria-label="选择关卡">选关</button><button id="menu-btn" class="icon-button restart-button" aria-label="返回封面"><span>封面</span></button><button id="tutorial-btn" class="icon-button restart-button" aria-label="操作教学"><span>教学</span></button>
      <div class="tint-legend" id="tint-legend" role="img" aria-label="柱子颜色：薄荷绿表示下一次上升，橙红表示下一次下降"><span class="tint-chip tint-up"></span><b>升</b><span class="tint-chip tint-down"></span><b>降</b></div>
      <div class="restart-stars"><button id="reset" class="icon-button restart-button" aria-label="重新开始" title="重新开始本关"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a8 8 0 1 1-1 7M4 3v5h5"/></svg><span>重新开始</span></button><span id="total-stars" aria-label="累计星星">★ 0</span></div>
    </nav>
  </header>
  <aside class="level-note"><span class="hairline"></span><p>让高低错落的石柱<br>成为一条相连的路。</p><span class="level-number"><span id="level-number">01</span> <i>/</i> <span id="total-levels">60</span></span></aside>
  <div class="step-count"><span id="steps">00</span><small>次升降</small><span id="min-moves" class="min-moves">最少 <b>1</b> 步</span><span id="max-moves" class="max-moves" hidden>限步最多 <b>4</b> 步</span></div>
  <footer>
    <div class="status" role="status" aria-live="polite"><span id="status-title">连接起点和终点</span><p id="hint">轻触石柱，连同四邻一起升降。</p></div>
    <div class="actions">
      <button id="undo" class="text-button undo-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 7 7"/></svg>撤销</button>
      <button id="confirm" class="primary">连接道路 <span aria-hidden="true">→</span></button>
      <button id="hint-btn" class="text-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8 13a6 6 0 1 1 8 0l-1 3H9Z"/></svg>提示</button>
    </div>
    <div class="bottom-tools"><span class="chapter-tag" id="chapter-tag">01 · 第一章</span><span class="moves-left" id="moves-left" hidden>剩余 <b>0</b> 次</span><span class="rotate-hint" id="rotate-hint">左右环绕 · 上滑俯视</span><button id="rotate" class="view-button" aria-label="恢复默认视角" title="回到初始视角"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="m16 3 8 4.5v9L16 21l-8-4.5v-9Z M8 7.5l8 4.5 8-4.5 M16 12v9 M4 10l-3 4 3 4 M28 10l3 4-3 4"/></svg><span>恢复视角</span></button><button id="top-view" class="view-button top-button" aria-label="俯视高度" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3Z M9 3v18 M15 3v18 M3 9h18 M3 15h18"/></svg><span>俯视 · 看高度</span></button></div>
  </footer>
  </div>
  <section id="cover" aria-label="Yellow 游戏封面">
    <div class="cover-copy"><h1>Yellow</h1><p class="cover-tagline">find the best route to the stars</p><div class="cover-actions"><button id="start-game">开始游戏 <span aria-hidden="true">→</span></button><button id="choose-level">选择关卡</button><button id="resume-game" hidden>继续当前关卡</button></div></div>

  </section>
  <dialog id="level-picker" aria-labelledby="picker-title"><div class="picker-top"><h2 id="picker-title">选择关卡</h2><span id="picker-stars" aria-label="累计星数">★ 0</span></div><div id="level-grid"></div><button id="picker-home" class="quiet-action">返回封面</button><button id="close-picker" class="quiet-action">返回游戏</button></dialog>
  <dialog id="completion" aria-labelledby="completion-title"><p class="dialog-kicker">JOURNEY COMPLETE</p><div id="completion-rating" class="completion-rating" role="img" aria-label="5 / 5 星"></div><h2 id="completion-title">通关成功</h2><p id="completion-detail"></p><p id="completion-retry-note" class="completion-retry-note" hidden>未找到最佳路线 · 重玩试试更少步数</p><button id="next-level" class="primary">进入下一关 →</button><p id="completion-tip" class="completion-tip" hidden></p><button id="completion-home" class="quiet-action">返回封面</button><button id="replay-level" class="quiet-action">重玩本关</button></dialog>
  <div id="inline-guide" class="inline-guide" role="dialog" aria-live="polite" hidden>
    <div class="guide-kicker"><span id="guide-step-label">教学 1 / 8</span><button id="guide-skip" class="quiet-action">跳过教学</button></div>
    <div id="guide-demo" class="guide-demo" aria-hidden="true"></div>
    <h2 id="guide-title"></h2>
    <p id="guide-copy"></p>
    <div class="guide-actions" id="guide-actions"><span id="guide-hint-do" class="guide-hint-do" hidden></span><button id="guide-prev" class="quiet-action" hidden>上一步</button><button id="guide-next" class="primary">确定 · 继续 →</button></div>
  </div>
  <div id="guide-swipe" aria-hidden="true"><svg viewBox="0 0 40 14" width="40" height="14"><path d="M6 7h28M10 3 6 7l4 4M30 3l4 4-4 4" fill="none" stroke="#775c80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>按住空白处 · 左右拖动环绕</span></div>
  <div id="loading" role="status"><div class="loading-diamond"></div><span>加载中</span></div>
  <div id="error" hidden>画面未能加载，请刷新页面或使用支持 WebGL 的浏览器。</div>
  <script type="module" src="src/main.js?v=5"></script>
  <script>
    if (location.protocol === 'file:') {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.innerHTML = '<div style="max-width:32rem;padding:0 1.5rem;text-align:center;line-height:2;font-size:.92rem;letter-spacing:.04em">'
          + '<strong style="display:block;font-size:1.2rem;letter-spacing:.18em;margin-bottom:1rem">需要本地服务才能运行</strong>'
          + '直接双击 index.html 时，浏览器会拦掉模块脚本。<br>'
          + '请双击文件夹里的「启动游戏.cmd」，<br>或在终端执行 <code>node server.cjs</code> 后访问 <code>http://localhost:8816</code>。'
          + '</div>';
      }
    }
  </script>
</body>
</html>
